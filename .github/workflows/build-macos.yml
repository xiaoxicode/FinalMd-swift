name: Build macOS App

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 编译并打包 FinalMd.app
    runs-on: macos-15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示工具链
        run: |
          xcode-select -p
          xcrun --show-sdk-path
          swift --version
          sw_vers

      - name: Markdown 双向转换冒烟测试（693 项）
        run: ./scripts/run-smoke.sh

      - name: 编译 Release 并组装 app
        run: ./scripts/make_app.sh

      - name: 校验 bundle 结构
        run: |
          APP="build/FinalMd.app"
          test -x "$APP/Contents/MacOS/FinalMd" || { echo "❌ 缺少可执行文件"; exit 1; }
          test -f "$APP/Contents/Info.plist" || { echo "❌ 缺少 Info.plist"; exit 1; }
          test -f "$APP/Contents/Resources/AppIcon.icns" || { echo "❌ 缺少图标"; exit 1; }
          # 本地化显示名：中文「墨写」，其余语言回退英文 FinalMd
          for L in en zh zh-Hans zh-Hant; do
            test -f "$APP/Contents/Resources/$L.lproj/InfoPlist.strings" || { echo "❌ 缺少 $L 本地化显示名"; exit 1; }
          done
          iconv -f UTF-16 -t UTF-8 "$APP/Contents/Resources/zh-Hans.lproj/InfoPlist.strings" | grep -q '"CFBundleDisplayName" = "墨写"'
          iconv -f UTF-16 -t UTF-8 "$APP/Contents/Resources/en.lproj/InfoPlist.strings" | grep -q '"CFBundleDisplayName" = "FinalMd"'
          test "$(plutil -extract CFBundleDisplayName raw -o - "$APP/Contents/Info.plist")" = "FinalMd" || { echo "❌ 默认名应为 FinalMd"; exit 1; }
          test "$(plutil -extract CFBundleDevelopmentRegion raw -o - "$APP/Contents/Info.plist")" = "en" || { echo "❌ 回退语言应为 en"; exit 1; }
          echo "默认名 / 回退语言：FinalMd / en"
          echo "版本：$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")"
          echo "最低系统：$(plutil -extract LSMinimumSystemVersion raw -o - "$APP/Contents/Info.plist")"
          # 签名必须真的有效：CI 上 codesign 失败若被静默吞掉，产出的 app 在 macOS 上会提示「已损坏」
          codesign --verify --deep --strict "$APP" || { echo "❌ 签名无效，app 无法打开"; exit 1; }
          # 网络权限必须真的签进 bundle，否则公证版里自定义大模型请求会失败
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -q "com.apple.security.network.client" || {
            echo "❌ 缺少 network.client entitlement"; exit 1; }
          codesign -dv "$APP" 2>&1 | head -3 || true
          du -sh "$APP"

      - name: 用 Developer ID 签名并公证（可选）
        # 脚本自己会判断：缺少证书类 secrets 时直接跳过，保持 make_app.sh 的 ad-hoc 签名。
        #   MACOS_CERTIFICATE             base64 的 .p12 开发者证书
        #   MACOS_CERTIFICATE_PASSWORD
        #   MACOS_KEYCHAIN_PASSWORD
        #   NOTARIZE_APPLE_ID / NOTARIZE_TEAM_ID / NOTARIZE_PASSWORD（App 专用密码）
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_TEAM_ID: ${{ secrets.NOTARIZE_TEAM_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
        run: ./scripts/sign_and_notarize.sh

      - name: 打成 zip 并记录校验和
        id: dist
        run: |
          VERSION="$(plutil -extract CFBundleShortVersionString raw -o - build/FinalMd.app/Contents/Info.plist)"
          ZIP="FinalMd-macOS-${VERSION}-${GITHUB_SHA::7}.zip"
          # 不要 --sequesterRsrc：它生成的 __MACOSX/._* AppleDouble 文件被第三方解压工具
          # 解进 bundle 后会破坏代码签名，表现出来就是「已损坏，无法打开」。
          ditto -c -k --keepParent "build/FinalMd.app" "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "::notice::未配置 Developer ID 时产物为 ad-hoc 签名，下载后若被 Gatekeeper 拦截，请先执行 xattr -dr com.apple.quarantine FinalMd.app"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: FinalMd-macOS-${{ github.run_number }}
          path: |
            FinalMd-macOS-*.zip
            FinalMd-macOS-*.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="${{ steps.dist.outputs.zip }}"
          # 同一个 tag 重跑时先删掉旧 release（连带旧附件），保证一个版本只挂一份包
          # 注意：gh 的 --jq 自带 raw 输出，再写 -r 会被当成多余参数报错
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' \
              | grep -E '^FinalMd-macOS-.*\.(zip|zip\.sha256)$' \
              | grep -v -x -e "$ZIP" -e "$ZIP.sha256" \
              | while read -r old; do gh release delete-asset "$GITHUB_REF_NAME" "$old" -y; done
          fi
          # 仓库里的 RELEASE_NOTES.md 是面向用户的说明，比自动生成的 commit 列表好读
          NOTES=()
          [ -f RELEASE_NOTES.md ] && NOTES=(--notes-file RELEASE_NOTES.md) || NOTES=(--generate-notes)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" --clobber
            [ -f RELEASE_NOTES.md ] && gh release edit "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md || true
          else
            # 创建偶尔会因 GitHub 侧抖动报 500（release 可能已建好但附件没挂上），
            # 这时退回上传模式，避免整个构建被判失败
            gh release create "$GITHUB_REF_NAME" --title "FinalMd $GITHUB_REF_NAME" \
              "${NOTES[@]}" "$ZIP" "$ZIP.sha256" \
              || gh release upload "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" --clobber
          fi
