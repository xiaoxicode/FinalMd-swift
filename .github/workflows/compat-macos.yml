name: Markdown 兼容性回归

# 与 build-macos.yml 并列的独立 job：每次 push / PR 都用仓库内已提交的
# 416 份真实语料 + 1327 条官方规范用例跑解析器往返，并用阈值闸门拦回归。
# 语料全部来自 git，CI 不需要联网下载，也不需要任何 secrets。
# 冒烟测试（699 项）同时覆盖外部文件体检、独立与列表项内缩进代码块、
# Obsidian 双链 / 嵌入内联卡片 / Callout 折叠与行内强调 / 格式改动开关、
# 任务框点选、空表头表格往返、链接内强调开闭顺序、`1)` 列表 URL 带点、
# 纯删除线 + 裸邮箱 autolink、[TOC] 指令逐字保留，以及 CommonMark
# flanking / rule of 3 / openers_bottom / removeDelimitersBetween 等逻辑；
# 阈值闸门见 scripts/check-compat-thresholds.py：required_features_100 要求
# 双链 / 嵌入 / Callout / 任务框 / 缩进代码块五类特征 100%，
# 逐字保留要求 872/872 = 100%，min_feature_rates 当前为空。
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    name: 416 份语料 + 1327 条规范用例往返测试
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 需要 HEAD 里提交的 RESULTS.json 作为「上一版」对比基线
          fetch-depth: 2

      - name: 显示工具链
        run: |
          xcode-select -p
          xcrun --show-sdk-path
          swift --version
          python3 --version
          sw_vers

      - name: 保存上一版兼容性结果
        # PR 里 HEAD 是合并提交；取第一个父提交（目标分支）更能代表基线。
        run: |
          set -e
          BASE=""
          for REV in HEAD^1 HEAD; do
            if git cat-file -e "$REV:tests/fixtures/RESULTS.json" 2>/dev/null; then
              BASE="$REV"
              break
            fi
          done
          if [ -n "$BASE" ]; then
            git show "$BASE:tests/fixtures/RESULTS.json" > /tmp/finalmd-results-before.json
            echo "基线来自 $BASE"
            echo "FINALMD_BASELINE_RESULTS=/tmp/finalmd-results-before.json" >> "$GITHUB_ENV"
          else
            echo "仓库里没有上一版 RESULTS.json，跳过逐文件对比"
          fi

      - name: Markdown 双向转换冒烟测试
        run: ./scripts/run-smoke.sh

      - name: 编译并运行全量兼容性测试
        run: ./scripts/run-compat.sh

      - name: 语料完整性与回归阈值
        # 同时校验：MANIFEST 的 sha256 / 字节数；
        # BASELINE.json 的绝对阈值（含 avg_retention / avg_structure /
        # file_stable / case_converged 等）；
        # required_features_100 五类语法特征（双链 / 嵌入 / Callout /
        # 任务框 / 缩进代码块）100% 逐字保留；
        # min_feature_rates（当前为空，预留给未来低频语法）；
        # 六轮往返的收敛判定（三轮 / 四轮会分别误报第 3 轮才稳定、
        # 旧算法下第 5→6 轮才稳定的「退化后收敛」文件；本次按 CommonMark
        # 定界符栈重写后这类文件第 1 轮即稳定，六轮保留作回归余量）；
        # 以及相对上一版的逐文件保留率 / 稳定性倒退。
        run: python3 scripts/check-compat-thresholds.py

      - name: 生成中文兼容性报告
        run: python3 scripts/gen-compat-report.py

      - name: 上传测试产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-compat-${{ github.run_number }}
          path: |
            tests/fixtures/RESULTS.json
            COMPATIBILITY.md
          if-no-files-found: warn
          retention-days: 14
